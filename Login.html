<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueCare - Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/index.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">

            <h1>QueueCare</h1>
            <p>
                Clinic Queue Management System
            </p>

        </div>

        <div
            class="error"
            id="errorMessage"
        ></div>

        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >

                Sign In

            </button>

        </form>

    </div>

</div>

<script>

const API =
    "http://localhost:5000";

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const button =
                document
                    .getElementById("loginButton");

            const error =
                document
                    .getElementById("errorMessage");

            error.style.display =
                "none";

            button.textContent =
                "Signing in...";

            button.classList.add(
                "loading"
            );

            try {

                const response =
                    await fetch(
                        `${API}/login`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                        }
                    );

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Login failed."
                    );

                }

                // SAVE LOGIN DETAILS
                localStorage.setItem(
                    "queuecareToken",
                    data.token
                );

                localStorage.setItem(
                    "queuecareUser",
                    JSON.stringify(
                        data.user
                    )
                );

                // ROLE REDIRECTION
                if (
                    data.user.role ===
                    "admin"
                ) {

                    window.location.href =
                        "Admin.html";

                }

                else if (
                    data.user.role ===
                    "doctor"
                ) {

                    window.location.href =
                        "Doctor.html";

                }

                else if (
                    data.user.role ===
                    "reception"
                ) {

                    window.location.href =
                        "Reception.html";

                }

                else {

                    throw new Error(
                        "Unknown user role."
                    );

                }

            }

            catch (err) {

                error.textContent =
                    err.message;

                error.style.display =
                    "block";

                button.textContent =
                    "Sign In";

                button.classList.remove(
                    "loading"
                );

            }

        }
    );

</script>

</body>
</html>
